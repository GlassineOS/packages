# Check build: the changed packages, for each architecture they are published for
# (scripts/changed.sh --arch; all of an architecture's recipes while nothing is published
# for it yet), signed with a throwaway key, kept as an artifact. Never published. On main
# the publish workflow builds instead (once the repo is public).
# Also the host tests of the publish job's retention rule (scripts/test-retain.sh) and
# package selection (scripts/test-changed.sh, scripts/test-unpublished.sh).
# A branch is checked through its pull request only: a push to a branch would build
# the same changes again, and a new branch's first push has no previous commit to
# compare with, so it would build every recipe. A branch without a pull request can
# be checked by hand (workflow_dispatch).
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: 'package directories (e.g. "device/linux-glassine-sdm660") or "all"'
        default: all

permissions:
  contents: read

concurrency:
  # a push builds only its own changes: one group per commit, so no push run is ever
  # cancelled or dropped from the queue; pull requests cancel superseded runs
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the publish job's retention rule (scripts/retain.sh), on made-up indexes, and its
  # package selection (scripts/changed.sh --arch, scripts/unpublished.sh), on a made-up repository
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # in the container the publish uses (busybox awk)
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.24 sh /src/scripts/test-retain.sh
      - run: sh scripts/test-changed.sh
      - run: sh scripts/test-unpublished.sh
  build:
    if: github.ref != 'refs/heads/main' || github.event_name != 'push' || github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select packages
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.packages }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ARCH: ${{ matrix.arch }}
        run: |
          a=$ARCH
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pkgs.glassine.org/alpine/v3.24/glassine/$a/APKINDEX.tar.gz")
          if [ "$code" = 404 ]; then
            echo "::notice::nothing published for $a yet: building all its recipes"
            p=$(scripts/changed.sh --arch "$a" all)
          else
            case "$EVENT" in
              workflow_dispatch) if [ "$INPUT" = all ]; then p=$(scripts/changed.sh --arch "$a" all)
                else p=$(scripts/changed.sh --arch "$a" all | grep -xF "$(printf '%s\n' $INPUT)" || :); fi ;;
              pull_request) p=$(scripts/changed.sh --arch "$a" "$PR_BASE") ;;
              *) p=$(scripts/changed.sh --arch "$a" "$BEFORE") ;;
            esac
          fi
          p=$(printf "%s" "$p" | tr "\n" " ")
          echo "packages=$p" >> "$GITHUB_OUTPUT"
          echo "packages: ${p:-none}"
      - name: Build
        if: steps.select.outputs.packages != ''
        run: scripts/docker-build.sh ${{ steps.select.outputs.packages }}
      - uses: actions/upload-artifact@v7
        if: steps.select.outputs.packages != ''
        with:
          name: packages-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 14
          path: out/
