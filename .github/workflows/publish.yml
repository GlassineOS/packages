# Publish: for each architecture (aarch64, x86_64), build the changed packages signed
# with the repository key, add the packages of the live repository that
# scripts/retain.sh keeps (earlier versions included, see README "Earlier versions"),
# index, sign; then deploy both architectures as one site to Pages (pkgs.glassine.org).
# The signing key is a secret of the "release" environment, which needs an approval
# (one per architecture job; both wait at the same time). Environments and Pages on
# private repositories need a paid plan, so this starts once the repository is public.
name: publish
on:
  push:
    branches: [main]
    # recipe changes publish (each run that builds waits for an approval); a change to
    # the selection publishes too, so it runs once on main (it usually selects nothing)
    paths:
      - 'keys/**'
      - 'device/**'
      - 'glassine/**'
      - 'forks/**'
      - 'arches/**'
      - '.github/workflows/publish.yml'
      - 'scripts/changed.sh'
      - 'scripts/unpublished.sh'
  workflow_dispatch:
    inputs:
      packages:
        description: 'package directories to rebuild, "all", or "missing" (only the recipes whose version is not published; each architecture builds those published for it)'
        default: all
      select_only:
        description: 'only print the selection: build and publish nothing (runs beside a publish, never waits for one)'
        type: boolean
        default: false

permissions:
  contents: read

# one publish at a time. GitHub keeps one pending run per group: a newer run replaces
# a pending one, so a push's own changes may never get a run of their own; the select
# job therefore also builds every recipe whose version the published index lacks
# (scripts/unpublished.sh). A select-only run has a group of its own.
concurrency:
  group: ${{ inputs.select_only && format('publish-select-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false

env:
  # the repository; each architecture is a directory below it
  REPO_URL: https://pkgs.glassine.org/alpine/v3.24/glassine

jobs:
  # what each architecture builds: the recipes its push changed (scripts/changed.sh
  # --arch, against the push's previous commit) and every recipe whose current version
  # its published index lacks (scripts/unpublished.sh: the changes of pushes whose runs
  # were replaced, failed or cancelled); all of them while nothing is published for it
  # yet (a new architecture). A dispatch builds the listed ones, all, or the missing.
  select:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      aarch64: ${{ steps.select.outputs.aarch64 }}
      x86_64: ${{ steps.select.outputs.x86_64 }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select packages
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.packages }}
          BEFORE: ${{ github.event.before }}
        run: |
          any=
          for a in aarch64 x86_64; do
            # GitHub Pages may serve an index up to 10 minutes old: that only selects more
            rm -f index.tar.gz
            code=$(curl -s -o index.tar.gz -w '%{http_code}' "$REPO_URL/$a/APKINDEX.tar.gz")
            case "$code" in
            200)
              rm -rf index && mkdir index
              tar -xzf index.tar.gz -C index APKINDEX
              grep -q '^P:' index/APKINDEX || { echo "::error::$REPO_URL/$a/APKINDEX.tar.gz: no packages in it"; exit 1; }
              missing=$(scripts/unpublished.sh --arch "$a" index/APKINDEX)
              if [ "$EVENT" != workflow_dispatch ]; then
                changed=$(scripts/changed.sh --arch "$a" "$BEFORE")
                if [ -n "$missing" ]; then echo "$a: not published at their version: $(printf '%s' "$missing" | tr '\n' ' ')"; fi
                # both, in build order
                want=$(printf '%s\n%s\n' "$changed" "$missing" | sed '/^$/d')
                p=$(scripts/changed.sh --arch "$a" all | grep -xF "$want" || :)
              elif [ "$INPUT" = all ]; then p=$(scripts/changed.sh --arch "$a" all)
              elif [ "$INPUT" = missing ]; then p=$missing
              else p=$(scripts/changed.sh --arch "$a" all | grep -xF "$(printf '%s\n' $INPUT)" || :)
              fi ;;
            404)
              echo "::notice::nothing published for $a yet: building all its recipes"
              p=$(scripts/changed.sh --arch "$a" all) ;;
            *) echo "::error::$REPO_URL/$a/APKINDEX.tar.gz: HTTP $code"; exit 1 ;;
            esac
            p=$(printf "%s" "$p" | tr "\n" " ")
            echo "$a=$p" >> "$GITHUB_OUTPUT"
            echo "$a: ${p:-none}"
            any=$any$p
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.any != '' && !inputs.select_only
    strategy:
      matrix:
        include:
          # CAP: each architecture's share of the 900 MiB site cap (scripts/retain.sh);
          # the site job checks the sum
          - arch: aarch64
            runner: ubuntu-24.04-arm
            lock: lock
            cap: 876609536 # 836 MiB
          - arch: x86_64
            runner: ubuntu-24.04
            lock: lock.x86_64
            cap: 67108864 # 64 MiB
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: release
    steps:
      - uses: actions/checkout@v7
      # every version a lock of GlassineOS/images main names stays published (stages/*/lock
      # for aarch64, stages/*/lock.x86_64 for x86_64)
      - name: The images locks
        env:
          LOCK: ${{ matrix.lock }}
        run: |
          mkdir -p work
          if git clone -q --depth 1 https://github.com/GlassineOS/images work/images; then
            for f in work/images/stages/*/"$LOCK"; do
              if [ -f "$f" ]; then cat "$f"; fi
            done > work/locks
            echo "$(wc -l < work/locks) lock lines ($LOCK)"
          else
            echo "::warning::GlassineOS/images unreachable: only the 30-day window keeps earlier versions"
            : > work/locks
          fi
          rm -rf work/images
      # the last publish's packages, so a publish doesn't download the whole site again
      # ("published-": the aarch64 cache from before there were two architectures)
      - uses: actions/cache/restore@v6
        with:
          path: work/published
          key: published-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            published-${{ matrix.arch }}-
            ${{ matrix.arch == 'aarch64' && 'published-' || format('published-{0}-', matrix.arch) }}
      # no packages for this architecture: it carries its published repository forward
      - name: Build, merge with the live repository, index
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
          CAP: ${{ matrix.cap }}
          ARCH: ${{ matrix.arch }}
          PACKAGES: ${{ needs.select.outputs[matrix.arch] }}
        run: |
          [ -n "$ABUILD_PRIVKEY" ] || { echo "::error::ABUILD_PRIVKEY missing in the release environment"; exit 1; }
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::runner is $(uname -m), not $ARCH"; exit 1; }
          echo "$ARCH: ${PACKAGES:-nothing to build}"
          scripts/docker-build.sh --merge "$REPO_URL/$ARCH" --locks work/locks --cache work/published \
            $PACKAGES
          echo "$ARCH: $(du -sh "out/alpine" | cut -f1)"
      - uses: actions/cache/save@v6
        with:
          path: work/published
          key: published-${{ matrix.arch }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.arch }}-${{ github.run_id }}
          retention-days: 1
          path: out/

  # one site with both architectures (Pages replaces the whole site on each deploy)
  site:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: repo-*-${{ github.run_id }}
          merge-multiple: true
          path: out
      - name: Landing page, size
        run: |
          scripts/site.sh out
          for d in out/alpine/*/glassine/*/; do echo "$d: $(du -sh "$d" | cut -f1)"; done
          size=$(du -sb out | cut -f1)
          echo "site: $size bytes"
          [ "$size" -le 943718400 ] || { echo "::error::the site is larger than 900 MiB"; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # the default 10 minutes is sometimes too short for GitHub's file sync; the
          # action cancels a deployment that times out, and a rerun from the same
          # commit reuses its ID (pages_build_version = the commit) and has stayed stuck:
          # publish from a newer commit instead
          timeout: 1200000
