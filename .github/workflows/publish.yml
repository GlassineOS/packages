# Publish: build the changed packages signed with the repository key, add the packages
# of the live repository that scripts/retain.sh keeps (earlier versions included, see
# README "Earlier versions"), index, sign, deploy to Pages (pkgs.glassine.org).
# The signing key is a secret of the "release" environment, which needs an approval
# per run. Environments and Pages on private repositories need a paid plan, so this
# starts once the repository is public.
name: publish
on:
  push:
    branches: [main]
    # only recipe changes publish (each run waits for an approval)
    paths: ['keys/**', 'device/**', 'glassine/**', 'forks/**']
  workflow_dispatch:
    inputs:
      packages:
        description: 'package directories to rebuild, or "all"'
        default: all

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REPO_URL: https://pkgs.glassine.org/alpine/v3.24/glassine/aarch64

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    environment: release
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select packages
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.packages }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$INPUT" = all ]; then p=$(scripts/changed.sh all); else p=$INPUT; fi
          else
            p=$(scripts/changed.sh "$BEFORE")
          fi
          p=$(printf "%s" "$p" | tr "\n" " ")
          echo "packages=$p" >> "$GITHUB_OUTPUT"
          echo "packages: ${p:-none}"
      # every version a lock of GlassineOS/images main names stays published
      - name: The images locks
        if: steps.select.outputs.packages != ''
        run: |
          mkdir -p work
          if git clone -q --depth 1 https://github.com/GlassineOS/images work/images; then
            cat work/images/stages/*/lock > work/locks
            echo "$(wc -l < work/locks) lock lines"
          else
            echo "::warning::GlassineOS/images unreachable: only the 30-day window keeps earlier versions"
            : > work/locks
          fi
          rm -rf work/images
      # the last publish's packages, so a publish doesn't download the whole site again
      - uses: actions/cache/restore@v6
        if: steps.select.outputs.packages != ''
        with:
          path: work/published
          key: published-${{ github.run_id }}
          restore-keys: published-
      - name: Build, merge with the live repository, index
        if: steps.select.outputs.packages != ''
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          [ -n "$ABUILD_PRIVKEY" ] || { echo "::error::ABUILD_PRIVKEY missing in the release environment"; exit 1; }
          scripts/docker-build.sh --merge "$REPO_URL" --locks work/locks --cache work/published \
            ${{ steps.select.outputs.packages }}
          scripts/site.sh out
          echo "site: $(du -sh out | cut -f1)"
      - uses: actions/cache/save@v6
        if: steps.select.outputs.packages != ''
        with:
          path: work/published
          key: published-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        if: steps.select.outputs.packages != ''
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # the default 10 minutes is sometimes too short for GitHub's file sync; the
          # action cancels a deployment that times out, and a rerun from the same
          # commit reuses its ID (pages_build_version = the commit) and has stayed stuck:
          # publish from a newer commit instead
          timeout: 1200000
