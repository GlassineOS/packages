# glassine-device-seed: the Note Air's own files and where they come from.
# DEVICE_PART: the partition the seed lives on (glassine/ on it; the stock files
# there stay untouched). vendor_b is the B slot's vendor partition, a clone of
# the stock vendor partition.
DEVICE_PART=vendor_b
# NAME  SOURCE (PART:/PATH, read read-only)  CHECK
# the panel's waveform, at the root of the stock system partition
waveform.wbf  system_a:/waveform/eink_waveform.wbf  wbf
