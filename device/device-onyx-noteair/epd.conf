# The panel daemons' device adapter for the Note Air's e-ink panel (1872x1404,
# mounted rotated: the UI is portrait). key=value, "#" starts a comment.
panel_width=1872
panel_height=1404
rotation=ccw
# the panel's waveform: the device seed's copy (glassine-device-seed, in glassine-deploy)
waveform=/run/glassine/device/waveform.wbf
# the panel temperature: the battery's, in tenths of a degree
temperature=/sys/class/power_supply/qcom-battery/temp
temperature=/sys/class/power_supply/battery/temp
temperature_scale=10
# the frontlight's two channels (warm and cold)
frontlight=/sys/class/backlight/frontlight-a/brightness
frontlight=/sys/class/backlight/frontlight-b/brightness
