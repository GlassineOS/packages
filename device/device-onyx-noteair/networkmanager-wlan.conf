# The WCN3990 gives ath10k no MAC address ("invalid MAC address; choosing random"),
# so each boot was a new client to the access point and leases ran out. A MAC per
# network that stays the same (NetworkManager's "stable", from its secret key), and
# no random MAC for scans either.
[device-onyx-noteair-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-onyx-noteair-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=stable
